<header class="dute-header glass-nav" x-ref="header" :class="{'is-fixed': headFixed}">
    <div class="dute-header-main">
        {{ include "../widget/logo.html" }}
        {{ include "../widget/nav.html" }}
        <div class="dute-header-search">
            <form action="/search" method="get">
                <input type="text" name="keyword" placeholder="输入关键字搜索" autocomplete="off">
                <button type="submit" class="dute-search-gradient-btn" aria-label="搜索">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                    </svg>
                </button>
            </form>
        </div>
        <div class="dute-mobile-actions">
            <div class="cursor-pointer" x-on:click="showDrawer = true">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" x2="20" y1="12" y2="12"></line>
                    <line x1="4" x2="20" y1="6" y2="6"></line>
                    <line x1="4" x2="20" y1="18" y2="18"></line>
                </svg>
            </div>
        </div>
    </div>
</header>

<div x-show="showDrawer" x-on:click="showDrawer = false" class="fixed z-50 inset-0 w-full h-full bg-black bg-opacity-60 drawer" x-cloak>
    <div class="absolute right-0 h-full p-4 overflow-auto bg-white dute-drawer-panel" x-on:click.stop>
        <div x-html="menu?.innerHTML || ''" class="grid grid-cols-1 divide-y divide-gray-200"></div>
    </div>
</div>
