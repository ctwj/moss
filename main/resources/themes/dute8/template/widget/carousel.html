{{carousel := Widget.Carousel()}}

{{ if len(carousel) > 0}}
<link rel="stylesheet" href="/swiper-bundle.min.css">
<div class="swiper dute-home-swiper w-full overflow-hidden" style="height: 100%;">
    <div class="swiper-wrapper">
        {{ range i, v :=  carousel}}
            {{ if v.Image != ""}}
                <div class="swiper-slide overflow-hidden">
                    <a class="block relative w-full h-full rounded overflow-hidden" href="{{v.Link}}">
                        <img class="w-full h-full object-cover" src="{{v.Image}}" alt="{{v.Title}}" loading="lazy" />
                        {{ if v.Title != ""}}
                        <div class="w-full h-8 md:h-10 text-sm md:text-base px-3 md:px-4 absolute bottom-0 left-0 overflow-hidden bg-black bg-opacity-50 text-white font-medium flex items-center backdrop-blur-sm">{{v.Title}}</div>
                        {{end}}
                    </a>
                </div>
            {{end}}
        {{end}}
    </div>
    <div class="swiper-pagination"></div>
</div>
<script src="/swiper-bundle.min.js"></script>
<script>
    new Swiper ('.dute-home-swiper', {
        loop: true,
        autoplay: {
            delay: 4000,
            disableOnInteraction: false,
        },
        autoHeight: false,
        pagination: {
            el: '.swiper-pagination',
            clickable: true,
        },
    })
</script>

{{ else }}
<!-- 无轮播时显示占位图 -->
<div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-blue-100 to-green-100 rounded-lg">
    <div class="text-center p-8">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-3 opacity-60">
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
            <circle cx="9" cy="9" r="2"/>
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
        </svg>
        <p class="text-gray-400 text-sm">暂无轮播图</p>
    </div>
</div>
{{end}}
