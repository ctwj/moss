{{ block home_recent_list(list,limit=10) }}
    {{ if len(list) == 0 }}
    <div class="dute-empty-state">
        <div class="dute-empty-state-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
            </svg>
        </div>
        <h3 class="dute-empty-state-title">暂无更新</h3>
        <p class="dute-empty-state-desc">精彩内容即将上线！</p>
    </div>
    {{ else }}
    <ul class="dute-recent-list">
        {{ range i, v := list }}
            {{ if i < limit }}
            <li>
                <div class="dute-recent-title">
                    <a href="{{ v.URL() }}">{{ v.Title }}</a>
                </div>
                <div class="dute-recent-meta">
                    {{ if v.CreateTime > 0 }}
                    <time>{{ v.CreateTimeFormat("01-02") }}</time>
                    {{ end }}
                    <a href="{{ v.URL() }}">查看</a>
                </div>
            </li>
            {{ end }}
        {{ end }}
    </ul>
    {{ end }}
{{ end }}
